name: Basic Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdown-and-docs:
    name: Markdown and MkDocs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Compile check scripts
        run: uv run python -m compileall scripts

      - name: Run repository quality checks
        run: uv run python scripts/check_all.py

      - name: Build MkDocs site
        run: uv run mkdocs build --strict
