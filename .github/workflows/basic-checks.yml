name: Basic Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdown-and-docs:
    name: Markdown and MkDocs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check scripts
        run: python -m compileall scripts

      - name: Run repository quality checks
        run: python scripts/check_all.py

      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict
