site_name: XQWA Security Knowledge Base
site_description: 面向网络安全社团的教学资料库
repo_url: https://github.com/QXMRX/xqwa-security-knowledge-base
repo_name: QXMRX/xqwa-security-knowledge-base

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - 首页: index.md
  - 新成员入门: getting-started.md
  - CTF 网络安全实战基础:
      - 学期课程大纲: ctf-course-outline.md
      - 课程首页: courses/ctf-101/index.md
      - 学习指南: courses/ctf-101/learning-guide.md
      - 视觉与内容标准: courses/ctf-101/art-direction.md
      - 第 1 周:
          - 什么是 CTF: courses/ctf-101/week-01/lesson-01-ctf.md
          - Linux 与终端基础: courses/ctf-101/week-01/lesson-02-linux.md
  - 项目治理:
      - 目录设计: governance/repository-structure.md
      - 安全边界: governance/safety.md
      - Pull Request 审核流程: governance/pr-review-process.md
      - 分支保护建议: governance/branch-protection.md
      - 自动检查: governance/automated-checks.md
      - AI Review: governance/ai-review.md
      - Pages 部署: governance/pages-deployment.md
      - 许可证建议: governance/license.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
